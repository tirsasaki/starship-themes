"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
palette = 'wabi_sabi'

format = """
[╭─](fg:dim)[](fg:indigo)$os$username[](fg:indigo bg:surface)$directory[](bg:surface fg:indigo)$git_branch$git_status[](fg:indigo)
[╰─](fg:dim)$character"""
right_format = "$status$cmd_duration$time"

[palettes.wabi_sabi]
black      = '#14161C'
surface    = '#1E212B'
overlay    = '#2A2E3A'
foreground = '#D9D3C7'
dim        = '#6B7280'
indigo     = '#5B7C99'
matcha     = '#8FA37E'
terracotta = '#B5615A'
bamboo     = '#B8A369'

[os]
disabled = false
style = 'bg:indigo fg:foreground bold'
format = '[ $symbol ]($style)'

[os.symbols]
AIX = '󰣇'
Alpaquita = ''
AlmaLinux = ''
Alpine = ''
ALTLinux = ''
Amazon = ''
Android = ''
AOSC = ''
Arch = ''
Artix = ''
Bazzite = '󰊴'
Bluefin = '󰈺'
CachyOS = ''
CentOS = ''
Debian = ''
DragonFly = ''
Elementary = ''
EndeavourOS = ''
Fedora = ''
FreeBSD = ''
Garuda = ''
Gentoo = ''
Kali = ''
KDENeon = ''
Linux = ''
Macos = ''
Manjaro = ''
Mint = ''
NixOS = ''
Nobara = ''
OpenBSD = ''
openSUSE = ''
Pop = ''
Raspbian = ''
Redhat = ''
RedHatEnterprise = ''
RockyLinux = ''
Solus = ''
SUSE = ''
Ubuntu = ''
Unknown = ''
Void = ''
Windows = '󰍲'
Zorin = ''

[username]
show_always = true
style_user = 'bg:indigo fg:foreground bold'
style_root = 'bg:terracotta fg:foreground bold'
format = '[( $user )]($style)'

[directory]
style = 'bg:surface fg:bamboo bold'
format = '[( 󰉋 $path )]($style)'
truncation_length = 3
truncation_symbol = '…/'
read_only = ' 󰌾'

[git_branch]
symbol = '󰘬 '
style = 'bg:indigo fg:foreground bold'
format = '[( $symbol$branch )]($style)'

[git_status]
style = 'bg:surface fg:terracotta bold'
format = '[$all_status$ahead_behind ]($style)'
conflicted = '󰞇 '
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇕ '
untracked = '•${count} '
modified = '!${count} '
staged = '+${count} '
renamed = '»${count} '
deleted = '×${count} '
stashed = '󰏗${count} '

[cmd_duration]
min_time = 1500
style = 'fg:matcha bold'
format = '[ 󰔟 $duration ]($style)'

[time]
disabled = false
time_format = '%H:%M'
style = 'fg:dim'
format = '[  󰥔 $time ]($style)'

[character]
success_symbol = '[刀](bold fg:matcha)'
error_symbol = '[刀](bold fg:terracotta)'
vicmd_symbol = '[侍](bold fg:indigo)'

[status]
disabled = false
style = 'fg:terracotta bold'
format = '[✘ $status ]($style)'
