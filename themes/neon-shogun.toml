"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
palette = 'neon_shogun'

format = """
[╭─](fg:dim)[](fg:magenta)$os$username[](fg:magenta bg:surface)$directory[](bg:surface fg:blue)$git_branch$git_status[](fg:blue)
[╰─](fg:dim)$character"""
right_format = "$status$cmd_duration$time"

[palettes.neon_shogun]
black = '#0B0D14'
surface = '#151828'
overlay = '#221B35'
foreground = '#F6EEFF'
dim = '#7A7295'
magenta = '#D88BFF'
blue = '#9D7BFF'
cyan = '#7EE7FF'
green = '#9CF4CC'
yellow = '#F9D98C'
orange = '#FFB88C'
red = '#FF6F9F'
pink = '#F7C8FF'

[os]
disabled = false
style = 'bg:magenta fg:black bold'
format = '[ $symbol ]($style)'

[os.symbols]
AIX = '󰣇'
Alpaquita = ''
AlmaLinux = ''
Alpine = ''
ALTLinux = ''
Amazon = ''
Android = ''
AOSC = ''
Arch = ''
Artix = ''
Bazzite = '󰊴'
Bluefin = '󰈺'
CachyOS = ''
CentOS = ''
Debian = ''
DragonFly = ''
Elementary = ''
EndeavourOS = ''
Fedora = ''
FreeBSD = ''
Garuda = ''
Gentoo = ''
Kali = ''
KDENeon = ''
Linux = ''
Macos = ''
Manjaro = ''
Mint = ''
NixOS = ''
Nobara = ''
OpenBSD = ''
openSUSE = ''
Pop = ''
Raspbian = ''
Redhat = ''
RedHatEnterprise = ''
RockyLinux = ''
Solus = ''
SUSE = ''
Ubuntu = ''
Unknown = ''
Void = ''
Windows = '󰍲'
Zorin = ''

[username]
show_always = true
style_user = 'bg:magenta fg:black bold'
style_root = 'bg:red fg:black bold'
format = '[$user ]($style)'

[directory]
style = 'bg:surface fg:foreground bold'
format = '[ 󰉋 $path ]($style)'
truncation_length = 3
truncation_symbol = '…/'
read_only = ' 󰌾'

[git_branch]
symbol = '󰘬 '
style = 'bg:magenta fg:black bold'
format = '[ $symbol$branch ]($style)'

[git_status]
style = 'bg:surface fg:magenta bold'
format = '[$all_status$ahead_behind ]($style)'
conflicted = '󰞇 '
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇕ '
untracked = '•${count} '
modified = '!${count} '
staged = '+${count} '
renamed = '»${count} '
deleted = '×${count} '
stashed = '󰏗${count} '

[cmd_duration]
min_time = 1500
style = 'fg:cyan bold'
format = '[ 󰔟 $duration ]($style)'

[time]
disabled = false
time_format = '%H:%M'
style = 'fg:dim'
format = '[  󰥔 $time ]($style)'

[character]
success_symbol = '[刀](bold fg:magenta)'
error_symbol = '[刀](bold fg:red)'
vicmd_symbol = '[侍](bold fg:cyan)'

[status]
disabled = false
style = 'fg:red bold'
format = '[✘ $status ]($style)'